system:
  toc_filename: "ToC.json"
  docs_root: "./docs-for-testing"
  output_dir: "output"
  reports_dir: "reports"
  artifacts_dir: "artifacts"
  notebook_dir: "notebook"
  batch_size: 5

# Model Provider Configurations
providers:
  gemini:
    model_name: "gemini-2.5-pro"
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    model_name: "moonshotai/kimi-k2.5"

# Agent-Specific Model Selection
# Note: The CLI flag -m (gemini|openrouter) selects which key to use for each agent.
agents:
  map_maker:
    openrouter: "google/gemma-3-27b-it"
    gemini: "gemini-2.0-flash-001"
  coordinator:
    openrouter: "x-ai/grok-4.1-fast"
    gemini: "gemini-2.5-pro"
    prompt:
      name: "coordinator-agent"
      label: "production"
  permissions_agent:
    openrouter: "x-ai/grok-4.1-fast"
    gemini: "gemini-2.5-flash"
    prompt:
      name: "permissions-agent"
      label: "production"
  constraints_agent:
    openrouter: "x-ai/grok-4.1-fast"
    gemini: "gemini-2.5-flash"
    prompt:
      name: "negative-constraints-agent"
      label: "production"
  boundaries_agent:
    openrouter: "x-ai/grok-4.1-fast"
    gemini: "gemini-2.5-flash"
    prompt:
      name: "security-boundaries-agent"
      label: "production"
