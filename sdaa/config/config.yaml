system:
  toc_filename: "ToC.json"
  docs_root: "./docs-for-testing"
  output_dir: "output"
  reports_dir: "reports"
  artifacts_dir: "artifacts"

# Model Provider Configurations
providers:
  gemini:
    model_name: "gemini-2.5-pro"
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    model_name: "moonshotai/kimi-k2.5"

# Agent-Specific Model Selection
# Note: These are overridden by the CLI flag -m
agents:
  map_maker:
    provider: "openrouter"
    model: "google/gemini-2.0-flash-001"
  coordinator:
    provider: "openrouter"
    model: "moonshotai/kimi-k2.5"
  permissions_agent:
    provider: "openrouter"
    model: "google/gemini-2.0-flash-001"
  constraints_agent:
    provider: "openrouter"
    model: "google/gemini-2.0-flash-001"
  boundaries_agent:
    provider: "openrouter"
    model: "google/gemini-2.0-flash-001"
