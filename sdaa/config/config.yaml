system:
  toc_filename: "ToC.json"
  docs_root: "/home/guid/engagements/hex.tech/hex.tech_docs"
  output_dir: "/home/guid/engagements/hex.tech/DocsDiver/notebook_context_management/output"
  reports_dir: "/home/guid/engagements/hex.tech/DocsDiver/notebook_context_management/reports"
  artifacts_dir: "/home/guid/engagements/hex.tech/DocsDiver/notebook_context_management/artifacts"
  notebook_dir: "/home/guid/engagements/hex.tech/DocsDiver/notebook_context_management/notebook"
  batch_size: 5

# Model Provider Configurations
providers:
  gemini:
    model_name: "gemini-2.5-pro"
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    model_name: "moonshotai/kimi-k2.5"

# Agent-Specific Model Selection
# Note: The CLI flag -m (gemini|openrouter) selects which key to use for each agent.
agents:
  map_maker:
    openrouter: "google/gemma-3-27b-it"
    gemini: "gemini-2.0-flash-001"
  coordinator:
    openrouter: "x-ai/grok-4.1-fast"
    gemini: "gemini-2.5-pro"
    prompt:
      name: "coordinator-agent"
      label: "latest"
  permissions_agent:
    openrouter: "x-ai/grok-4.1-fast"
    gemini: "gemini-2.5-flash"
    prompt:
      name: "permissions-agent"
      label: "latest"
  constraints_agent:
    openrouter: "x-ai/grok-4.1-fast"
    gemini: "gemini-2.5-flash"
    prompt:
      name: "negative-constraints-agent"
      label: "latest"
  boundaries_agent:
    openrouter: "x-ai/grok-4.1-fast"
    gemini: "gemini-2.5-flash"
    prompt:
      name: "security-boundaries-agent"
      label: "latest"
  report_synthesizer:
    openrouter: "x-ai/grok-4.1-fast"
    gemini: "gemini-2.5-pro"
    prompt:
      name: "report-synthesizer"
      label: "latest"
